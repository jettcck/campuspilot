name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      # 自包含冒烟测试：不依赖外部数据库，覆盖鉴权、校验、越权、分页、限流
      - name: 接口冒烟测试
        run: npm run smoke

      # 生产配置校验：验证 fail-fast、优雅启动与就绪探针在生产模式下均可用
      - name: 生产模式启动校验
        env:
          NODE_ENV: production
          ALLOW_FILE_STORAGE: 'true'
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          PORT: '3001'
        run: |
          node server/index.js > server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health/ready; then ready=1; break; fi
            sleep 1
          done
          cat server.log
          test "$ready" = "1"

  docker-image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Docker 镜像可构建
        run: docker build -t campuspilot:ci .