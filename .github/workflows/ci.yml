name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 启动后端并做健康检查
        run: |
          node server/index.js &
          sleep 5
          curl -sf http://localhost:3001/api/health
          curl -sf -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@campuspilot.dev","password":"Demo123456"}'

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Docker 镜像可构建
        run: docker build -t campuspilot:ci .