# CampusPilot Nginx 反向代理配置
# 前端由 Node 进程托管（NODE_ENV=production 时 express 会返回 dist/index.html），
# 这里负责统一入口、HTTP→HTTPS 跳转、上传文件直出与 API 转发。
#
# 使用前请把 your-domain.com 全部替换为真实域名，并先执行：
#   sudo certbot --nginx -d your-domain.com
# certbot 会把证书写入 /etc/letsencrypt/live/your-domain.com/ 并自动续期。

upstream campuspilot_app {
    server app:3001;
    keepalive 32;
}

# -------- 80 端口：只做跳转，不放行任何明文业务 --------
server {
    listen 80;
    server_name your-domain.com;

    # 证书签发与续期的 ACME 校验路径必须保持明文可达
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------- 443 端口：全站 HTTPS --------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与应用的 helmet 配置保持一致；preload 需确认全站子域均可 HTTPS 后再开启
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 上传的课程资料由 Nginx 直接返回，减轻 Node 压力
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 接口转发
    location /api/ {
        proxy_pass http://campuspilot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端页面与静态资源
    location / {
        proxy_pass http://campuspilot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 缺失该头会让应用无从判断原始协议，HTTPS 强制跳转与安全日志都会失真
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}